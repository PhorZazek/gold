<style>
  .gold-container { 
      max-width: 400px; 
      padding: 20px; 
      border: 1px solid #ccc; 
      border-radius: 10px; 
      margin: 20px auto; 
      font-size: 18px;
  }
  .gold-options button {
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      font-size: 16px;
  }
  .result-box {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
  }
</style>

<div class="gold-container">
    <h2>Aktualna cena złota</h2>
    <div>
        <span id="cenaEntry">Ładowanie...</span>
    </div>

    <p>Wybierz próbę:</p>

    <div class="gold-options">
        <button onclick="chooseGold(333)">333</button>
        <button onclick="chooseGold(375)">375</button>
        <button onclick="chooseGold(500)">500</button>
        <button onclick="chooseGold(585)">585</button>
        <button onclick="chooseGold(750)">750</button>
        <button onclick="chooseGold(999)">999</button>
    </div>

    <div id="gold-result" class="result-box" style="display:none;">
        <p><strong>Wybrana próba:</strong> <span id="prob"></span></p>
        <p><strong>Cena za 1g:</strong> <span id="cena1g"></span> zł</p>

        <p>
            <label>Podaj wagę (g):</label><br>
            <input id="waga" type="number" value="1" min="0" step="0.01" oninput="updateTotal()" style="width:120px; padding:5px;">
        </p>

        <p><strong>Cena za podaną wagę:</strong> <span id="total"></span> zł</p>
    </div>
</div>

<script>
let basePrice = 0;
let selectedProb = 0;

async function chooseGold(prob) {
    selectedProb = prob;

    try {
        const response = await fetch("https://phorzazek.pythonanywhere.com/gold_price/");
        const data = await response.json();

        // Cena złota 999/1000 (czyste)
        const cenaCzyste = data.cena;

        // Przeliczenie według próby
        basePrice = ((prob / 1000) * cenaCzyste).toFixed(2);

        document.getElementById("prob").textContent = prob;
        document.getElementById("cena1g").textContent = basePrice;

        document.getElementById("gold-result").style.display = "block";

        updateTotal();
    } catch (err) {
        alert("Błąd połączenia z API.");
        console.error(err);
    }
}

function updateTotal() {
    const waga = parseFloat(document.getElementById("waga").value) || 0;
    const total = (waga * basePrice).toFixed(2);
    document.getElementById("total").textContent = total;
}

});
</script>
